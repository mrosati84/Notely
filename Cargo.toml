[package]
name = "notely"
version = "0.1.0"
edition = "2021"
description = "Image annotation made simple - annotate any screenshot."
license = "MIT"

[package.metadata.bundle]
name = "Notely"
identifier = "com.notely.app"
icon = ["icons/icon.icns"]
version = "0.1.0"
short_description = "Image annotation made simple"
long_description = "Annotate any screenshot: arrows, rectangles, ellipses, highlights, blur, spotlight and text. Copy to clipboard or export as PNG."
category = "Graphics and Design"
copyright = "© 2026 Notely"

[package.metadata.bundle.osx]
minimum_system_version = "11.0"
info_plist_exts = ["macos/Info.plist.ext"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSEvent", "block2"] }
objc2-foundation = { version = "0.2", features = [
    "NSAppleEventDescriptor",
    "NSAppleEventManager",
    "NSNotification",
    "NSURL",
    "NSString",
] }
block2 = "0.5"

[dependencies]
eframe = "=0.31.1"
egui = "=0.31.1"
image = "=0.25.5"
tiny-skia = "=0.11.4"
ab_glyph = "=0.2.29"
rfd = "=0.15.1"
arboard = "=3.4.1"

[profile.release]
opt-level = 3
